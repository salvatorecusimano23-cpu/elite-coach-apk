name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installa dipendenze e crea progetto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compila APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica file APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: EliteCoach-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
